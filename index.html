<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d3540;--dots:#244251;--panel:#ece3cb;--panel2:#ddd2b4;--ink:#231f1a;--muted:#6b6250;
  --bar:#27457d;--barInk:#f4efe1;--note:#f2d45c;--noteInk:#231f1a;--bad:#b8392e;--good:#2f7a3c;--edge:#1a1612;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e25;--dots:#152a33;--panel:#2f2b25;--panel2:#3b362e;--ink:#efe6cf;--muted:#b4a98f;--edge:#000;--good:#6cc27b;--bad:#d9564a}}
:root[data-theme="dark"]{--bg:#0f1e25;--dots:#152a33;--panel:#2f2b25;--panel2:#3b362e;--ink:#efe6cf;--muted:#b4a98f;--edge:#000;--good:#6cc27b;--bad:#d9564a}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.5px,transparent 1.5px);background-size:8px 8px;color:var(--ink);font-family:'VT323',ui-monospace,Menlo,monospace;font-size:20px;line-height:1.2;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px}
.logo{font-family:'Silkscreen','Courier New',monospace;font-size:24px;color:var(--note);text-shadow:3px 3px 0 #000;margin:0}
.hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-bottom:6px}
.stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stat{background:var(--panel);border:3px solid var(--edge);padding:1px 8px;box-shadow:2px 2px 0 var(--edge)}
.stat b{font-weight:normal;color:var(--muted)}
.hbtn{background:var(--panel2);border:3px solid var(--edge);padding:1px 8px;box-shadow:2px 2px 0 var(--edge)}
.hbtn:active{transform:translate(2px,2px);box-shadow:none}
.stage{position:relative;border:4px solid var(--edge);box-shadow:5px 5px 0 var(--edge);background:#000;overflow:hidden}
canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none}
.hint{background:var(--panel);border:3px solid var(--edge);border-top:0;padding:3px 10px;min-height:32px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint .obj{color:var(--muted)}
.paused{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:var(--note);font-family:'Silkscreen',monospace;font-size:28px}
.dbox{position:absolute;left:8px;right:8px;bottom:8px;background:#fbf7ea;color:#1d1a16;border:4px solid #1d1a16;box-shadow:inset 0 0 0 3px #c9bf9f;padding:12px 14px 10px;font-size:22px}
.dbody{max-height:calc(var(--stageH,400px) * .62);overflow-y:auto}
.dbox .spk{position:absolute;top:-16px;left:12px;background:#27457d;color:#fff;border:3px solid #1d1a16;padding:0 8px;font-size:18px}
.dbox .more{float:right;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dbox .chs{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.dbox .ch{text-align:left;background:transparent;border:0;padding:2px 4px 2px 20px;position:relative}
.dbox .ch.on::before{content:"\25B6";position:absolute;left:2px;font-size:14px;top:6px}
.dbox .ch:hover{background:#efe6c9}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:10px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
.dpad button,.ab button{touch-action:none;background:var(--panel2);border:3px solid var(--edge);box-shadow:2px 2px 0 var(--edge);font-family:'Silkscreen',monospace;font-size:16px}
.dpad button:active,.ab button:active{transform:translate(2px,2px);box-shadow:none}
.ab{display:flex;gap:14px;align-items:center}
.ab button{width:64px;height:64px;border-radius:50%}
.ab .a{background:var(--note);color:var(--noteInk)}
.keys{color:var(--muted);font-size:17px;text-align:center}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
.kbhint{color:var(--muted)}
@media (hover:none),(pointer:coarse){.kbhint{display:none}}
@media (max-width:600px){.logo{font-size:18px}.stat,.hbtn{font-size:17px;padding:0 6px}.hud{gap:4px}.keys{display:none}.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}.ab button{width:58px;height:58px}.pad{margin-top:6px}.tree{width:42%}}
.screen{position:fixed;inset:0;z-index:40;overflow-y:auto;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.5px,transparent 1.5px);background-size:8px 8px;padding:20px 12px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.win{background:var(--panel);border:3px solid var(--edge);box-shadow:5px 5px 0 var(--edge);margin:0 auto 16px;max-width:640px}
.win>h2{margin:0;background:var(--bar);color:var(--barInk);font-family:'Silkscreen','Courier New',monospace;font-size:13px;font-weight:normal;padding:6px 10px;display:flex;justify-content:space-between;gap:8px}
.wb{padding:10px 14px}
.btn{background:var(--panel2);border:3px solid var(--edge);padding:5px 12px;box-shadow:2px 2px 0 var(--edge);margin:4px 6px 4px 0}
.btn.primary{background:var(--note);color:var(--noteInk)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
:focus-visible{outline:3px dashed var(--note);outline-offset:2px}
.big{font-family:'Silkscreen','Courier New',monospace;font-size:34px;margin:4px 0}
.meta{color:var(--muted)}
.red{color:var(--bad)}.green{color:var(--good)}
.scoreRow{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dotted var(--muted);padding:4px 0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(54px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:60;width:min(78vw,320px);pointer-events:none}
.toast{background:var(--note);color:var(--noteInk);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:3px 9px;font-size:18px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.modal .win{width:100%;max-height:90vh;overflow-y:auto}
.qs{display:flex;flex-direction:column;align-items:stretch}
.qs .btn{text-align:left}

.diffs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.diff{text-align:left;background:var(--panel2);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.diff.rec{background:var(--note);color:var(--noteInk)}
.diff:active{transform:translate(2px,2px);box-shadow:none}
.diff .dn{font-family:'Silkscreen',monospace;font-size:15px}
.diff .dd{font-size:18px;opacity:.85}
.tag{font-family:'VT323',monospace;font-size:16px;background:#1a1612;color:#f2d45c;padding:0 6px;margin-left:6px}
.hbtn.go{background:var(--note);color:var(--noteInk);animation:blink 1.2s steps(2) infinite}
.coachcard{position:fixed;right:12px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:45;width:min(380px,calc(100vw - 24px));background:#fbf7ea;color:#1d1a16;border:4px solid #1d1a16;box-shadow:5px 5px 0 #1d1a16;padding:8px 12px 10px;font-family:'VT323',monospace;font-size:20px;line-height:1.2}
.coachcard .ch1{display:flex;justify-content:space-between;align-items:center;font-family:'Silkscreen',monospace;font-size:12px;color:#6b6250;margin-bottom:4px}
.coachcard .ch1 button{background:transparent;border:0;text-decoration:underline;color:#6b6250;font-family:'VT323',monospace;font-size:17px}
.coachcard b{font-family:'Silkscreen',monospace;font-size:14px;font-weight:normal;color:#27457d}
.coachcard p{margin:4px 0}
.coachcard .cwait{color:#b8392e;animation:blink 1.4s steps(2) infinite}
.cbtn{background:#f2d45c;border:3px solid #1d1a16;box-shadow:2px 2px 0 #1d1a16;padding:2px 14px;font-family:'Silkscreen',monospace;font-size:13px;margin-top:4px}
.coachcard.inl{position:static;width:auto;margin-top:10px;box-shadow:4px 4px 0 #1d1a16}
.coachcard.pcm{bottom:calc(52px + env(safe-area-inset-bottom,0px))}
@media (max-width:600px){.coachcard{top:calc(6px + env(safe-area-inset-top,0px));bottom:auto;right:6px;font-size:18px}}
.helpwin{max-width:720px}
#waveban{position:fixed;inset:0;z-index:80;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wb-band{width:100%;background:repeating-linear-gradient(-45deg,#1a1612 0 18px,#262019 18px 36px);border-top:5px solid #f2d45c;border-bottom:5px solid #f2d45c;padding:18px 10px 20px;text-align:center;box-shadow:0 0 0 100vmax rgba(0,0,0,.4);animation:wbIn 2.6s cubic-bezier(.2,.8,.2,1) forwards}
.wb-big{font-family:'Silkscreen',monospace;font-size:clamp(40px,9vw,92px);line-height:1;color:#f2d45c;text-shadow:4px 4px 0 #b8392e,8px 8px 0 #000;letter-spacing:4px}
.wb-big span{display:inline-block;animation:wbLetter .45s steps(5) both}
.wb-band.clear{border-color:#6cc27b}.wb-band.clear .wb-big{color:#8dffa8;text-shadow:4px 4px 0 #2f7a3c,8px 8px 0 #000}
.wb-band.final{border-color:#e8742a}.wb-band.final .wb-big{color:#ffb15c;text-shadow:4px 4px 0 #b8392e,8px 8px 0 #000}
.wb-sub{font-family:'VT323',monospace;font-size:clamp(20px,3.6vw,32px);color:#fff;margin-top:10px;animation:wbFade .4s .45s both}
.wb-tix{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wb-chip{font-family:'VT323',monospace;font-size:20px;background:#f2d45c;color:#1a1612;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:1px 10px;animation:wbPop .35s steps(4) both}
@keyframes wbIn{0%{transform:translateX(-105%)}14%{transform:translateX(0)}84%{transform:translateX(0);opacity:1}100%{transform:translateX(105%);opacity:0}}
@keyframes wbLetter{0%{transform:translateY(-50px) scale(1.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes wbFade{from{opacity:0}to{opacity:1}}
@keyframes wbPop{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
@keyframes wbFadeOut{0%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wb-band{animation:wbFadeOut 2.6s forwards}.wb-big span,.wb-sub,.wb-chip{animation:none}}
.callp{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:min(340px,calc(100vw - 20px));z-index:56;background:#fff;color:#1d2833;border:1px solid #5b6b7a;box-shadow:0 6px 22px rgba(0,0,0,.45);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px;line-height:1.35;display:flex;flex-direction:column;max-height:52vh;border-radius:4px;overflow:hidden}
.callp.ingame{top:calc(60px + env(safe-area-inset-top,0px))}
.callh{background:#2f8f83;color:#fff;display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;flex:none}
.callh .dot{width:9px;height:9px;border-radius:50%;background:#8dffa8;flex:none;animation:blink 1.2s steps(2) infinite}
.callh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.callh .inc{font-size:11px;opacity:.85}
.callh button{background:transparent;border:0;color:#fff;font-size:14px;padding:0 4px;font-family:inherit}
.callb{overflow-y:auto;padding:8px 10px;flex:1;min-height:60px}
.callb p{margin:0 0 6px}
.callb .me{color:#1d5fbf}
.callb .sys{color:#6b7785;font-style:italic}
.callq{border-top:1px solid #e3e6ea;padding:6px 8px;background:#f6f8fa;max-height:45%;overflow-y:auto;flex:none}
.callq small{color:#5b6b7a}
.callq button{display:block;width:100%;text-align:left;background:#fff;border:1px solid #c9d2db;border-radius:3px;padding:4px 8px;margin:3px 0;font:inherit;color:#1d2833;cursor:pointer}
.callq button:hover{border-color:#2f8f83;background:#f0faf8}
@media (max-width:600px){.callp{max-height:40vh}.callp.ingame{top:calc(8px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){.callh .dot{animation:none}}
#tutring{position:fixed;pointer-events:none;z-index:70;border:3px dashed #f2d45c;border-radius:999px;box-shadow:0 0 0 3px rgba(26,22,18,.55),0 0 22px 6px rgba(242,212,92,.65);animation:tring 1.1s ease-in-out infinite}
#tutring::after{content:"\25BC";position:absolute;left:50%;top:-32px;margin-left:-10px;color:#f2d45c;font-size:22px;line-height:1;text-shadow:2px 2px 0 #1a1612;animation:tbob .55s ease-in-out infinite alternate}
@keyframes tring{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes tbob{to{top:-25px}}
.clink{background:transparent;border:0;padding:0;color:#27457d;text-decoration:underline;font-family:'VT323',monospace;font-size:19px;cursor:pointer}
.coachcard.pop{animation:cpop .45s ease-out}
@keyframes cpop{0%{transform:scale(.92);background:#f2d45c}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#tutring,#tutring::after,.coachcard.pop{animation:none}}
.htabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:6px}
.htabs .btn{font-size:17px;padding:2px 10px}
.hbody{background:var(--panel2);border:3px solid var(--edge);padding:6px 12px;margin-bottom:8px;max-height:52vh;overflow-y:auto}
.hbody p,.hbody li{margin:5px 0}
.np{position:fixed;left:12px;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:300px;height:260px;z-index:58;background:#fffbe0;border:3px solid #1a1612;box-shadow:4px 4px 0 #1a1612;display:flex;flex-direction:column}
.nph{background:#f2d45c;color:#1a1612;display:flex;align-items:center;gap:6px;padding:2px 6px;cursor:move;touch-action:none;font-family:'Silkscreen',monospace;font-size:12px;user-select:none}
.nph span{flex:1}
.nph button{background:#fff8d0;border:2px solid #1a1612;font-family:'VT323',monospace;font-size:16px;padding:0 6px;color:#1a1612}
.np textarea{flex:1;border:0;resize:none;padding:4px 8px;font-family:'VT323',monospace;font-size:20px;line-height:22px;color:#1a1612;background:#fffbe0 repeating-linear-gradient(transparent 0 21px,#e8dfb0 21px 22px);background-attachment:local;outline:none}
@media (max-width:600px){.np{width:calc(100vw - 24px);height:200px}}
.snlink{border:0;background:transparent;color:#1d6fb8;text-decoration:underline;padding:0;font:inherit;cursor:pointer}
.sni{color:#6b7a88;font-size:12px;margin-left:4px}
.tbmini{background:transparent;border:0;color:#fff;padding:0 10px}
.tbmini:hover{background:#2d2d2d}
/* ---------- Windows PC ---------- */
.pc{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13px;line-height:1.35;color:#000;background:#0a2f4a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pc button{font-family:inherit;font-size:13px}
.pc .dsk{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#1d6aa0,#0a2f4a 70%)}
.pc .icons{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:14px}
.pc .dicon{width:96px;background:transparent;border:1px solid transparent;color:#fff;text-align:center;padding:6px 2px;text-shadow:0 1px 2px #000}
.pc .dicon:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.pc .dicon svg{width:40px;height:40px;display:block;margin:0 auto 4px}
.taskbar{height:42px;flex:none;background:#1b1b1b;color:#fff;display:flex;align-items:stretch}
.tbtn{background:transparent;border:0;color:#fff;padding:0 12px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.tbtn.on{background:#333;border-bottom-color:#76b9ed}
.tbtn:hover{background:#2d2d2d}
.tclock{margin-left:auto;padding:0 12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font-size:12px;line-height:1.2}
.tlogoff{background:#8b2b23;border:0;color:#fff;padding:0 12px}
.appwin{position:absolute;inset:10px;background:#fff;border:1px solid #707070;display:flex;flex-direction:column;box-shadow:0 6px 24px rgba(0,0,0,.55)}
@media (max-width:760px){.appwin{inset:0}}
.wtitle{height:31px;flex:none;display:flex;align-items:center;gap:8px;padding-left:8px;background:#fff;border-bottom:1px solid #e3e3e3;white-space:nowrap;overflow:hidden}
.wtitle span{overflow:hidden;text-overflow:ellipsis}
.wctl{margin-left:auto;display:flex}
.wctl button{width:44px;height:31px;border:0;background:transparent;font-size:14px}
.wctl button:hover{background:#e5e5e5}
.wctl button.x:hover{background:#e81123;color:#fff}
.menubar{display:flex;flex:none;padding:1px 4px;background:#fff;border-bottom:1px solid #f0f0f0;position:relative}
.menubar>button{border:1px solid transparent;background:transparent;padding:2px 8px}
.menubar>button:hover,.menubar>button.on{background:#e5f3ff;border-color:#cce8ff}
.toolbar{display:flex;flex:none;gap:1px;padding:2px 4px;border-bottom:1px solid #d9d9d9;background:#fff}
.toolbar button{border:1px solid transparent;background:transparent;width:28px;height:26px;padding:0;display:flex;align-items:center;justify-content:center}
.toolbar button:hover:not(:disabled){border-color:#99d1ff;background:#e5f3ff}
.toolbar button:disabled{opacity:.35}
.toolbar .sep{width:1px;background:#ddd;margin:2px 4px}
.panes{flex:1;display:flex;min-height:0}
.tree{width:34%;min-width:140px;max-width:310px;overflow:auto;border-right:1px solid #d9d9d9;padding:3px 0;white-space:nowrap;user-select:none}
.tn{display:flex;align-items:center;gap:3px;padding:1px 4px 1px 0;cursor:default}
.tn .lbl{padding:0 3px;border:1px solid transparent}
.tn.sel .lbl{background:#cce8ff;border-color:#99d1ff}
.tn:hover .lbl{background:#e5f3ff}
.tg{width:14px;flex:none;text-align:center;color:#666;font-size:10px;cursor:pointer}
.list{flex:1;overflow:auto;position:relative;user-select:none;-webkit-user-select:none}
.list table{border-collapse:collapse;width:100%;min-width:480px}
.list th{position:sticky;top:0;background:#fff;text-align:left;font-weight:normal;color:#4c607a;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;padding:3px 6px;z-index:1}
.list td{padding:2px 6px;white-space:nowrap;border:1px solid transparent}
.list tr.sel td{background:#cce8ff}
.list tr:hover td{background:#e5f3ff}
.list tr.sel:hover td{background:#cce8ff}
.list .nm{display:flex;align-items:center;gap:4px}
.rowmore{margin-left:auto;border:1px solid transparent;background:transparent;width:24px;height:20px;padding:0;line-height:1;font-size:15px;color:#333;border-radius:2px;visibility:hidden}
.list tr:hover .rowmore,.list tr.sel .rowmore,.ml tr:hover .rowmore,.ml tr.sel .rowmore{visibility:visible}
.ml .nm{display:flex;align-items:center;gap:4px}
.rowmore:hover{border-color:#99d1ff;background:#fff}
@media (hover:none){.rowmore{visibility:visible}}
.toolbar .tbtext{width:auto;padding:0 8px;font-size:13px}
.sbtip{float:right;color:#666}
@media (max-width:760px){.sbtip{display:none}}
.statusbar{height:22px;flex:none;border-top:1px solid #d9d9d9;background:#f0f0f0;padding:2px 8px;font-size:12px;white-space:nowrap;overflow:hidden}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.cmenu{position:absolute;background:#f2f2f2;border:1px solid #a0a0a0;box-shadow:2px 2px 4px rgba(0,0,0,.35);padding:2px;z-index:20;min-width:190px}
.cmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 26px;white-space:nowrap}
.cmenu button:hover:not(:disabled){background:#91c9f7}
.cmenu button:disabled{color:#a0a0a0}
.cmenu hr{border:0;border-top:1px solid #d7d7d7;margin:2px 2px 2px 26px}

{id:1001,title:"Password expired, can't get in",npc:"dana.brooks",from:"Dana Brooks",dept:"Sales",desk:"S-04",priority:"Medium",via:"phone",arrive:3,

  {t:"Fixed it.",why:"Too vague. The next tech can't tell what you did or whether you verified the user."},

 check(ad,f,o){const u=ad.users["dana.brooks"],L=[];let fix=0,sec=30;

  if(reset&&!f.verified){sec=-20;L.push("You reset a password without verifying identity. That's exactly how attackers take over accounts.")}

let AC=null,muted=false;
function tone(f,dur,type,vol,delay){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.value=f;const t=AC.currentTime+(delay||0);g.gain.setValueAtTime(vol||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
const sfx={ring(){for(let i=0;i<4;i++){tone(1180,.07,"square",.035,i*.14);tone(940,.07,"square",.035,i*.14+.07)}},chime(){tone(660,.09);tone(990,.14,"square",.04,.09)},blip(){tone(520,.03,"square",.02)},err(){tone(150,.25,"sawtooth",.05)},ok(){tone(784,.08);tone(1046,.12,"square",.04,.08)}};

     const used=Object.values(S.npc).filter(n=>n.walkup).map(n=>n.x+","+n.y);const spot=WALKUP_SPOTS.find(s=>!used.includes(s[0]+","+s[1])&&!(P.x===s[0]&&P.y===s[1]));
     if(spot){S.gossipDone=true;Object.assign(ln,{x:spot[0],y:spot[1],dir:1,walkup:true,gossip:true});toast("Luis Ortega walked up to your desk.");uiDirty=true}}
   if(ln.gossip&&t7.status!=="open")luisHome();}
  arrive();

      S.waveDone=true;uiDirty=true;const lastW=S.wave===WAVES.length-1,wn=S.wave+1;setTimeout(()=>{if(S.screen==="game")showBanner(lastW?"SHIFT CLEAR!":"WAVE "+wn+" CLEAR!",lastW?"Every wave done. Clock out when you're ready.":"Take a breather. Start wave "+(wn+1)+" when you're ready.",null,"clear")},400)}
  }else if(S.t>=SHIFT_END&&S.screen==="game")endShift();

function arrive(){
  if(S.t>=SHIFT_END)return;
  for(const tk of S.tickets){
    if(tk.status!=="waiting"||S.t<tk.arrive)continue;
    if(tk.id===1006){const p=S.ad.users["priya.shah"];if(p&&p.groups.includes("GG_Finance_Share")){tk.status="skipped";toast("Priya's access was set up right, so no follow-up ticket!");continue}}

      const used=Object.values(S.npc).filter(n=>n.walkup).map(n=>n.x+","+n.y);const spot=WALKUP_SPOTS.find(s=>!used.includes(s[0]+","+s[1])&&!(P.x===s[0]&&P.y===s[1]))||WALKUP_SPOTS[0];
      Object.assign(S.npc[tk.npc],{x:spot[0],y:spot[1],dir:1,walkup:true});toast(tk.from+" walked up to your desk.");sfx.chime()}

  if(how==="call"){spend(2);tk.transcript.push({who:"System",text:tk.contacted?"You call "+tk.from+" back.":"You answer the desk phone.",sys:true})}
  else{tk.atDesk=true;tk.transcript.push({who:"System",text:"You visit desk "+tk.desk+" in person.",sys:true})}
  if(!tk.contacted){tk.contacted=true;tk.transcript.push({who:tk.from,text:introFor(tk)+tk.opening})}
}
function askQ(tk,i){
  const q=tk.dialog[i];if(tk.asked[i])return null;if(q.excl&&tk.dialog.some((x,j)=>x.excl===q.excl&&tk.asked[j]))return null;
  if(q.desk&&!tk.atDesk){toast("You need to be at "+(tk.desk||"their desk")+" in person for that.");return null}
  if(q.req&&!tk.flags[q.req]){toast("Ask a few more questions first.");return null}
  tk.asked[i]=true;
  const sys=/^\(/.test(q.a);
  tk.transcript.push({who:"You",text:q.q,me:true});
  tk.transcript.push({who:sys?"System":tk.from.replace(/"/g,""),text:q.a,sys});
  if(q.flag)tk.flags[q.flag]=q.time?S.t+0.001:true;
  if(q.bad)tk.badQs++;
  if(q.run)q.run();
  spend(q.cost||1);
  return q;
}
function grade(id,outcome,noteIdx){
  const tk=T(id);spend(2);
  const r=tk.check(S.ad,tk.flags,outcome,tk);
  const note=tk.notes[noteIdx];const noteP=note.good?15:0;
  r.lines.push(note.good?"Solid resolution note.":"Note: "+note.why);
  const wait=S.t-tk.arrive,dv=DIFF[S.diff].spdDiv;const spd=Math.max(0,15-(dv?Math.floor(wait/dv):0)-tk.badQs*3);
  if(tk.badQs)r.lines.push("You asked "+tk.badQs+" question"+(tk.badQs>1?"s":"")+" that just annoyed the user.");
  const total=Math.max(-50,Math.min(100,r.fix+r.sec+noteP+spd));
  tk.result={fix:r.fix,sec:r.sec,note:noteP,spd,total,lines:r.lines,outcome};
  tk.status="done";if(tk.via==="walk-up")sendHome(tk.npc);
  S.modal={type:"result",id};total>=70?sfx.ok():total<40?sfx.err():sfx.blip();
}

function startTalk(tk,how){

function talkNPC(id){
  const meet=()=>{const nn=S.npc[id];if(nn.met)return"";nn.met=true;return"Hi, I'm "+npcName(id)+". "};

    choose("Luis Ortega",m+"Hey... quick question. Is Greg getting fired? I saw HR walk past his desk and he looked really stressed.",[

function usePhone(){

function treeNode(p,depth){
  const kids=childConts(p);const open=!S.pc.collapsed.has(p);const sel=S.pc.path===p;

  if(open)h+=kids.map(k=>treeNode(k,depth+1)).join("");

function listItems(p){
  const ad=S.ad,items=[];
  if(p==="__saved")return items;
  childConts(p).forEach(c=>items.push({k:"o:"+c,name:leaf(c),type:CONT[c]==="ou"?"Organizational Unit":CONT[c]==="builtin"?"builtinDomain":"Container",desc:c==="Users"?"Default container for upgraded user accounts":c==="Computers"?"Default container for upgraded computer accounts":c==="Domain Controllers"?"Default container for domain controllers":"",icon:contIcon(c)}));
  Object.entries(ad.users).forEach(([s,u])=>{if(u.ou===p)items.push({k:"u:"+s,name:u.name,type:"User",desc:u.desc,icon:u.enabled?SVG.user:SVG.userdis})});
  Object.entries(ad.groups).forEach(([g,o])=>{if(o.ou===p)items.push({k:"g:"+g,name:g,type:o.scope==="Builtin Local"?"Security Group - Domain Local":"Security Group - "+o.scope,desc:o.desc,icon:SVG.group})});
  Object.entries(ad.computers).forEach(([c,o])=>{if(o.ou===p)items.push({k:"c:"+c,name:c,type:"Computer",desc:o.desc,icon:SVG.comp})});
  return items.sort((a,b)=>a.name.localeCompare(b.name));
}

function renderClose(tk,cl){

  let field="";

function userDraft(u){return{first:u.first,last:u.last,display:u.name,desc:u.desc,office:u.office,phone:u.phone,email:u.email,title:u.title,dept:u.dept,manager:u.manager,unlock:false,mustChange:u.mustChange,cannotChange:u.cannotChange,neverExpires:u.neverExpires,disabled:!u.enabled,expMode:u.expires==="Never"?"never":"end",expDate:u.expires==="Never"?"":u.expires,groups:[...u.groups],mSel:null}}
function applyUser(d){
  const u=S.ad.users[d.sam];if(!u)return false;const r=d.draft;
  if(r.expMode==="end"&&!r.expDate){msg("Active Directory Domain Services","Enter a date for \"End of\", or choose Never.","err");return false}
  if(r.mustChange&&r.cannotChange){msg("Active Directory Domain Services","You cannot select both \"User must change password at next logon\" and \"User cannot change password\" for the same user.","err");return false}
  if(r.mustChange&&r.neverExpires){r.mustChange=false;msg("Active Directory Domain Services","You specified that the password should never expire. The user will not be required to change the password at next logon.","warn")}
  if(u.system&&r.disabled!==!u.enabled){msg("Active Directory Domain Services","Insufficient access rights to perform the operation.","err");return false}
  const add=r.groups.filter(g=>!u.groups.includes(g)),rem=u.groups.filter(g=>!r.groups.includes(g));
  for(const g of add){if(!addGroup(u,g))r.groups=r.groups.filter(x=>x!==g)}
  rem.forEach(g=>removeGroup(u,g));
  if(r.unlock&&u.locked)unlockUser(u);r.unlock=false;
  Object.assign(u,{first:r.first,last:r.last,name:r.display||u.name,desc:r.desc,office:r.office,phone:r.phone,email:r.email,title:r.title,dept:r.dept,mustChange:r.mustChange,cannotChange:r.cannotChange,neverExpires:r.neverExpires,enabled:!r.disabled,expires:r.expMode==="never"?"Never":r.expDate});
  return true;
}
function startNewUser(path,copy){
  if(path===""||path==="__saved"||path==="Builtin"){msg("Active Directory Users and Computers","Select an organizational unit or container in the tree first, then create the user there.","info");return}
  pushDlg({type:"newuser",step:1,path,copy:copy||null,draft:{first:"",init:"",last:"",full:"",logon:"",p1:"",p2:"",must:true,cannot:false,never:false,disabled:false}});
}
function nuNext(d){
  const r=d.draft;
  if(d.step===1){const logon=r.logon.trim().toLowerCase();
    if(!r.full.trim()){msg(d.copy?"Copy Object - User":"New Object - User","The full name field is required.","err");return}
    if(!logon){msg(d.copy?"Copy Object - User":"New Object - User","The user logon name field is required.","err");return}
    if(/[\s"\/\\\[\]:;|=,+*?<>@]/.test(logon)){msg("Active Directory Domain Services","The user logon name contains one or more illegal characters.","err");return}
    if(Object.entries(S.ad.users).some(([k,x])=>(x.logon||k)===logon)){msg("Active Directory Domain Services","The user logon name you have chosen is already in use in this enterprise. Choose another logon name, and then try again.","err");return}
    d.step=2}
  else if(d.step===2){
    if(r.p1!==r.p2){msg("Active Directory Domain Services","The passwords do not match. Type the new password in both text boxes.","err");return}
    if(!complex(r.p1)){msg("Active Directory Domain Services","Windows cannot set the password for "+r.full+" because:\n"+POLICY_TXT,"err");return}
    if(r.must&&r.never){msg("Active Directory Domain Services","You specified that the password should never expire. The user will not be required to change the password at next logon.","warn");r.must=false}
    if(r.must&&r.cannot){msg("Active Directory Domain Services","You cannot select both \"User must change password at next logon\" and \"User cannot change password\".","err");return}
    d.step=3}
  else{
    const logonName=r.logon.trim().toLowerCase(),src=d.copy?S.ad.users[d.copy]:null;
    const base=((r.first.trim()+"."+r.last.trim()).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z.\-]/g,""))||logonName;let sam=base,nn=2;while(S.ad.users[sam])sam=base+(nn++);
    const u=mkU(r.first.trim(),r.last.trim(),d.path,"",src?src.dept:"",[],{name:r.full.trim(),pwdLastSet:TODAY,mustChange:r.must,cannotChange:r.cannot,neverExpires:r.never,enabled:!r.disabled,created:TODAY,email:sam+"@ridgeline.com",manager:src?src.manager:""});
    let blocked=[];if(src)src.groups.forEach(g=>{if(PROTECTED.includes(g)){blocked.push(g);u.itAdminTry=true}else{u.groups.push(g);u.groupAt[g]=S.t}});
    u.empId=makeEmpId(u.first,u.last,new Set(Object.values(S.ad.users).map(x=>x.empId)));u.logon=logonName;S.ad.users[sam]=u;S.ad.created.push(sam);S.pc.path=d.path;S.pc.selKey="u:"+sam;closeDlg(d);
    if(blocked.length)msg("Active Directory Domain Services","The user was created, but could not be added to: "+blocked.join(", ")+".\n\nInsufficient access rights to perform the operation.","err");
    toast("Created "+logonName);
  }
  uiDirty=true;renderUI();
}
function checkNames(d){
  const t=d.draft.text.trim();if(!t){msg("Select Groups","Enter a group name to search for.","info");return false}
  const names=Object.keys(S.ad.groups);const exact=names.find(g=>g.toLowerCase()===t.toLowerCase());
  if(exact){d.draft.resolved=exact;d.draft.text=exact;d.draft.multi=null;return true}
  const m=names.filter(g=>g.toLowerCase().includes(t.toLowerCase()));
  if(m.length===1){d.draft.resolved=m[0];d.draft.text=m[0];d.draft.multi=null;return true}
  if(m.length>1){d.draft.multi=m;return false}
  msg("Name Not Found","An object (Group or Built-in security principal) with the following name cannot be found: \""+t+"\".\n\nCheck the selected object types and location for accuracy and ensure that you typed the object name correctly.","err");return false;
}
function doFind(d){const q=d.draft.name.trim().toLowerCase();const out=[];
  Object.entries(S.ad.users).forEach(([s,u])=>{if(!q||u.name.toLowerCase().includes(q)||s.includes(q)||(u.logon||'').includes(q)||(u.empId||'').toLowerCase().includes(q))out.push({k:"u:"+s,name:u.name,type:"User",desc:u.desc,icon:u.enabled?SVG.user:SVG.userdis})});
  Object.entries(S.ad.groups).forEach(([g,o])=>{if(!q||g.toLowerCase().includes(q))out.push({k:"g:"+g,name:g,type:"Security Group",desc:o.desc,icon:SVG.group})});
  Object.entries(S.ad.computers).forEach(([c,o])=>{if(!q||c.toLowerCase().includes(q))out.push({k:"c:"+c,name:c,type:"Computer",desc:o.desc,icon:SVG.comp})});
  d.draft.results=out.sort((a,b)=>a.name.localeCompare(b.name));d.draft.sel=null}

    else if(o.t==="c")msg("Active Directory Domain Services","Are you sure you want to delete the Computer named '"+o.id+"'?","warn",[["Yes",()=>{delete S.ad.computers[o.id];S.pc.selKey=null}],["No",null]]);
    else msg("Active Directory Domain Services","You do not have sufficient privileges to delete "+leaf(o.id)+", or this object is protected from accidental deletion.","err");
    break}
  case"m-creset":if(o&&o.t==="c")msg("Active Directory Domain Services","Are you sure you want to reset the computer account?","warn",[["Yes",()=>{S.ad.computers[o.id].reset=true;setTimeout(()=>msg("Active Directory Domain Services","Account "+o.id+" was successfully reset.","info"),0)}],["No",null]]);break;

const held=[];let lastTs=0,hudMin=-1;
const KEYDIR={ArrowDown:0,s:0,S:0,ArrowLeft:1,a:1,A:1,ArrowRight:2,d:2,D:2,ArrowUp:3,w:3,W:3};
function canMove(){return S.screen==="game"&&!S.dlg&&!S.pc.open&&!S.modal&&!S.paused}
function pressDir(d){if(!held.includes(d))held.push(d);if(canMove()&&!P.moving&&P.dir!==d){P.dir=d;P.turnT=110}}
function releaseDir(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1)}
function update(dt){
  if(P.moving){P.t+=dt/170;if(P.t>=1){P.moving=false;P.t=0}}
  if(!P.moving&&held.length&&canMove()){const d=held[held.length-1];
    if(P.dir!==d&&!P.turnT){P.dir=d;P.turnT=70;return}
    const[dx,dy]=DIRV[d];P.dir=d;const nx=P.x+dx,ny=P.y+dy;
    if(!solidAt(nx,ny)){P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.moving=true;P.t=0;P.step++}}
  if(P.turnT){P.turnT=Math.max(0,P.turnT-dt);if(!held.length)P.turnT=0}
}
function interact(){
  if(!canMove())return;
  const[fx,fy]=facing();const id=npcAt(fx,fy);
  if(id){S.npc[id].dir=[3,2,1,0][P.dir];talkNPC(id);return}
  const o=OBJS[fx+","+fy];if(!o){return}
  switch(o.type){
   case"pc":openPC();sfx.blip();break;
   case"phone":usePhone();break;
   case"desk":say("","(Desk "+o.label+". Nobody's here right now.)");break;

   case"vending":say("","(The vending machine is out of your favorite snack again.)");break;
   case"counter":say("","(Someone left their dishes in the sink. Classic.)");break;
   case"shelf":say("","(Binders labeled \"Policies\", \"Procedures\", and \"Do Not Open\".)");break;
   case"plant":say("","(A very patient office plant.)");break;

  }
}
function faceHint(){
  if(!S.npc||S.screen!=="game")return"";

  const o=OBJS[fx+","+fy];if(!o)return"";

function goalHint(){
  if(S.screen!=="game")return"";
  if(DIFF[S.diff].waves&&S.waveDone)return S.wave===WAVES.length-1?"All waves cleared! Press Clock out when you're ready.":"Wave cleared! Explore, or press Start wave "+(S.wave+2)+" when ready.";
  if(DIFF[S.diff].waves&&S.wave<0)return"";
  const open=S.tickets.filter(t=>t.status==="open");
  if(open.some(t=>t.via==="phone"&&!t.contacted))return"Your desk phone is ringing!";
  const w=open.find(t=>t.via==="walk-up"&&!t.transcript.some(m=>m.me));if(w)return w.from+" is waiting at your desk.";
  const v=open.find(t=>t.via==="phone"&&t.contacted&&!t.atDesk&&t.dialog.some(q=>q.desk));if(v)return"Visit "+v.from+" at desk "+v.desk+".";
  if(open.length)return open.length+" open ticket"+(open.length>1?"s":"")+". Work them on your computer.";
  return DIFF[S.diff].waves?"Next ticket in this wave is on its way...":S.tickets.some(t=>t.status==="waiting")?"Queue is clear. Explore, or skip ahead.":"All done.";
}
function hudTick(){
  if(S.screen!=="game")return;const m=Math.floor(S.t);
  if(m!==hudMin){hudMin=m;document.getElementById("h-time").textContent=fmt(S.t);const pt=document.getElementById("pc-time");if(pt)pt.textContent=fmt(S.t)}

  if(DIFF[S.diff].waves){ww.hidden=false;document.getElementById("h-wave").textContent=Math.max(1,S.wave+1)+"/"+WAVES.length;skip.hidden=!S.waveDone;skip.textContent=S.wave===WAVES.length-1?"Clock out":"Start wave "+(S.wave+2);skip.classList.toggle("go",S.waveDone)}

function loop(ts){
  const dt=Math.min(100,ts-(lastTs||ts));lastTs=ts;
  if(S.screen==="game"){
    if(running()){S.t+=dt/DIFF[S.diff].ms;tick()}
    update(dt);draw(ts);hudTick();tutCheck();updateRing();if(S.tutPop&&ts-(S.tutT0||0)>700){S.tutPop=false}

}

  uiDirty=false;
  {const cp=document.getElementById("callpanel");if(cp){cp.innerHTML=renderCall();const cb=document.getElementById("callb");if(cb)cb.scrollTop=cb.scrollHeight}}
  const coachEl=document.getElementById("coach"),coachIn=document.getElementById("coach-inline");const inl=!(S.pc&&S.pc.open)&&window.innerWidth>600;if(coachEl)coachEl.innerHTML=inl?"":renderCoach();if(coachIn)coachIn.innerHTML=inl?renderCoach(true):"";
  const scr=document.getElementById("screen"),game=document.getElementById("game"),pc=document.getElementById("pc");
  if(S.screen==="title"){scr.hidden=false;scr.innerHTML=renderTitle();game.hidden=true;pc.hidden=true;document.getElementById("modal").innerHTML="";return}
  if(S.screen==="end"){scr.hidden=false;scr.innerHTML=renderEnd();game.hidden=true;pc.hidden=true;document.getElementById("modal").innerHTML="";return}
  scr.hidden=true;game.hidden=false;
  document.getElementById("dlgbox").innerHTML=renderDialogBox();
  document.getElementById("pausebox").innerHTML=S.paused?'<div class="paused">Paused</div>':"";
  document.getElementById("h-pause").textContent=S.paused?"Resume":"Pause";
  
  pc.hidden=!S.pc.open;
  if(S.pc.open){const ls=pc.querySelector(".list"),scroll=ls?ls.scrollTop:0,tr=pc.querySelector(".tree"),ts=tr?tr.scrollTop:0;const ffl=pc.querySelector(".snmain"),fs=ffl?ffl.scrollTop:0;
    pc.innerHTML=renderPC();
    const l2=pc.querySelector(".list");if(l2)l2.scrollTop=scroll;const t2=pc.querySelector(".tree");if(t2)t2.scrollTop=ts;const f2=pc.querySelector(".snmain");if(f2&&S.pc.keepScroll)f2.scrollTop=fs;S.pc.keepScroll=false;
    const top=pc.querySelector(".dlgback:last-of-type input:not([readonly]):not([type=checkbox]):not([type=radio]),.dlgback:last-of-type textarea");if(top&&S.pc.focusNew){top.focus();S.pc.focusNew=false}}
  document.getElementById("modal").innerHTML=renderModal();
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");
  if(S.pc&&S.pc.open&&(S.pc.menu||S.pc.mbar)&&!(b&&(/^(m-|pc-mbar|pc-newuser|pc-find|pc-refresh|pc-adv|pc-closeapp|pc-rowmenu|pc-actbtn)/.test(b.dataset.a)))){S.pc.menu=null;S.pc.mbar=null;uiDirty=true;if(!b||b.dataset.a==="pc-listbg"||b.dataset.a==="pc-desk"){renderUI();return}}
  if(!b||b.disabled)return;
  const d=b.dataset,a=d.a,id=d.id?Number(d.id):null;
  switch(a){
   case"start":sfx.blip();newGame(d.diff);return;
   case"title":S={screen:"title"};document.getElementById("coach").innerHTML="";renderUI();return;
   case"pause":S.paused=!S.paused;break;
   case"mute":muted=!muted;break;
   case"skip":{if(DIFF[S.diff].waves){if(!S.waveDone)break;if(S.wave===WAVES.length-1){endShift();return}startWave(S.wave+1)}else{const next=S.tickets.filter(t=>t.status==="waiting").sort((x,y)=>x.arrive-y.arrive)[0];if(next){S.t=Math.max(S.t,next.arrive);tick()}}break}
   case"dadv":advance();return;
   case"dpick":e.stopPropagation();pick(Number(d.i));return;
   case"note":{const m=S.modal;S.modal=null;grade(m.id,m.outcome,Number(d.i));break}
   case"mclose":S.modal=null;break;
   case"settings":S.modal={type:"settings"};break;
   case"help":S.modal={type:"help",tab:"basics"};break;
   case"htab":S.modal.tab=d.t;break;
   case"setdiff":setDifficulty(d.diff);break;
   case"tut-start":S.modal=null;if(S.pc.open)closePC();startTut();break;
   case"tut-next":tutAdvance();break;
   case"tut-skip":endTut();break;
   case"tut-show":S.tutShow=true;break;
   case"call-min":e.stopPropagation();S.callMin=!S.callMin;break;
   case"call-hide":e.stopPropagation();S.callHidden=true;break;
   case"call-show":S.activeTk=id;S.callHidden=false;S.callMin=false;break;
   case"call-ask":{const tk=T(S.activeTk);if(!tk)break;const q=askQ(tk,Number(d.i));if(q&&q.tip&&S.diff!=="expert")tk.transcript.push({who:"Tip",text:q.tip.replace(/^\(Tip: |\)$/g,""),sys:true});S.pc.keepScroll=true;break}
   case"np-toggle":npToggle();return;
   case"np-clear":if(confirm("Clear all notes?")){NP.ta.value="";try{localStorage.setItem("ticketrush-notes","")}catch(e){}}return;
   case"np-stamp":npStamp();return;
   case"ff-caller":pushDlg({type:"caller",sam:d.u});return;
   // PC shell
   case"pc-launch":S.pc.app=d.app;break;
   case"pc-closeapp":case"pc-min":S.pc.app=null;S.pc.menu=null;S.pc.mbar=null;break;
   case"pc-logoff":closePC();return;
   case"pc-desk":case"pc-listbg":if(a==="pc-desk"&&e.target.closest(".appwin,.dlgback"))return;if(a==="pc-listbg"&&(e.ctrlKey||e.metaKey)&&!e.target.closest("tr")){openCtx(e,null);return}if(a==="pc-listbg"&&e.target.closest("tr"))return;if(a==="pc-listbg"){S.pc.selKey=null}break;
   // ADUC
   case"pc-tree":S.pc.path=d.p;S.pc.selKey=null;if((e.ctrlKey||e.metaKey)&&d.p&&d.p!=="__saved"){openCtx(e,"o:"+d.p);return}break;
   case"pc-toggle":e.stopPropagation();if(S.pc.collapsed.has(d.p))S.pc.collapsed.delete(d.p);else S.pc.collapsed.add(d.p);break;
   case"pc-up":if(S.pc.path){S.pc.path=parentOf(S.pc.path);S.pc.selKey=null}break;
   case"pc-rowmenu":{e.stopPropagation();const r=b.getBoundingClientRect();openCtx({clientX:r.left,clientY:r.bottom},d.k);return}
   case"pc-actbtn":{const r=b.getBoundingClientRect();openCtx({clientX:r.left,clientY:r.bottom},S.pc.selKey);return}
   case"pc-row":{e.stopPropagation();const k=d.k;if(e.ctrlKey||e.metaKey){openCtx(e,k);return}if(S.pc.selKey===k){if(k[0]==="o"){S.pc.path=k.slice(2);S.pc.collapsed.delete(parentOf(k.slice(2)));S.pc.selKey=null}else openProps(k)}else S.pc.selKey=k;break}
   case"pc-mbar":S.pc.mbar=S.pc.mbar===d.m?null:d.m;S.pc.menu=null;break;
   // dialogs
   case"d-cancel":closeDlg();break;
   case"d-msgbtn":{const dl=topDlg();const fn=dl.buttons[Number(d.i)][1];closeDlg(dl);if(fn)fn();break}
   case"d-tab":topDlg().tab=d.t;if(d.t!=="General")S.tutSaw=true;break;
   case"d-info":msg("Active Directory Users and Computers",d.t,"info");return;
   case"d-props-ok":case"d-props-apply":{const dl=topDlg();const ok=applyUser(dl);if(ok){if(a==="d-props-ok")closeDlg(dl);else dl.draft=Object.assign(userDraft(S.ad.users[dl.sam]),{mSel:null});tick()}break}
   case"d-msel":topDlg().draft.mSel=d.g;break;
   case"d-mrem":{const dl=topDlg();dl.draft.groups=dl.draft.groups.filter(g=>g!==dl.draft.mSel);dl.draft.mSel=null;break}
   case"d-madd":S.pc.focusNew=true;pushDlg({type:"select",purpose:"props",draft:{text:"",resolved:null,multi:null}});return;
   case"d-check":checkNames(topDlg());break;
   case"d-multisel":{const dl=topDlg();dl.draft.resolved=d.g;dl.draft.text=d.g;dl.draft.multi=null;break}
   case"d-select-ok":{const dl=topDlg();if(!dl.draft.resolved&&!checkNames(dl))break;const g=dl.draft.resolved;
     if(dl.purpose==="props"){closeDlg(dl);const pd=topDlg();if(pd&&pd.type==="uprops"&&!pd.draft.groups.includes(g)&&g!=="Domain Users")pd.draft.groups.push(g)}
     else{closeDlg(dl);const u=S.ad.users[dl.sam];if(u&&addGroup(u,g)){tick();msg("Active Directory Domain Services","The Add to Group operation was successfully completed.","info")}}
     break}
   case"d-reset-ok":{const dl=topDlg(),u=S.ad.users[dl.sam],r=dl.draft;
     if(r.p1!==r.p2){msg("Active Directory Domain Services","The passwords do not match. Type the new password in both text boxes.","err");break}
     if(!complex(r.p1)){msg("Active Directory Domain Services","Windows cannot complete the password change for "+u.name+" because:\n"+POLICY_TXT,"err");break}
     u.resetAt=S.t;u.mustChange=r.must&&!u.neverExpires;if(r.unlock&&u.locked)unlockUser(u);closeDlg(dl);tick();
     msg("Active Directory Domain Services","The password for "+u.name+" has been changed."+(r.gen&&r.p1===r.gen?"\n\nTemp password: "+r.gen:"")+(r.must&&u.neverExpires?"\n\nNote: 'Password never expires' is set, so the user won't be forced to change it.":""),"info");break}
   case"d-genpw":{const dl=topDlg();if(dl&&dl.draft){const g=genTempPw();Object.assign(dl.draft,{p1:g,p2:g,gen:g})}break}
   case"d-nu-next":nuNext(topDlg());return;
   case"d-nu-back":{const dl=topDlg();dl.step=Math.max(1,dl.step-1);break}
   case"d-movesel":topDlg().draft.target=d.p;break;
   case"d-move-ok":{const dl=topDlg(),k=dl.key,t=dl.draft.target;if(!t)break;if(k[0]==="u")S.ad.users[k.slice(2)].ou=t;else S.ad.computers[k.slice(2)].ou=t;closeDlg(dl);S.pc.selKey=null;toast("Moved to "+canon(t));break}
   case"d-findnow":doFind(topDlg());break;
   case"d-findsel":{const dl=topDlg();if(e.ctrlKey||e.metaKey){dl.draft.sel=d.k;openCtx(e,d.k);return}if(dl.draft.sel===d.k){openProps(d.k);return}dl.draft.sel=d.k;break}
   case"d-findprops":{const dl=topDlg();if(dl.draft.sel){openProps(dl.draft.sel);return}break}
   // FixFlow
   case"ff-open":{S.pc.ffSel=id;S.pc.ffView="form";S.pc.ffClose=null;const tk=T(id);if(tk.contacted&&tk.via!=="ticket"&&tk.status==="open"){S.activeTk=id;S.callHidden=false}break}
   case"ff-back":S.pc.ffView="list";S.pc.ffClose=null;break;
   case"ff-filter":S.pc.ffFilter=d.f;S.pc.ffView="list";S.pc.ffClose=null;break;
   case"ff-ask":{const tk=T(id);askQ(tk,Number(d.i));S.pc.keepScroll=true;break}
   case"ff-mode":S.pc.ffClose={id:S.pc.ffSel,mode:d.m,note:null,code:"Solved (Permanently)",reason:"Awaiting Caller",group:"tier2"};break;
   case"ff-cancel":S.pc.ffClose=null;break;
   case"ff-submit":{const cl=S.pc.ffClose;if(!cl)break;if(cl.note==null){toast("Pick a note before submitting.");return}const out=cl.mode==="resolve"?"resolve":cl.mode==="hold"?"pending":cl.group;S.pc.ffClose=null;grade(cl.id,out,Number(cl.note));break}
   case"ff-review":S.modal={type:"result",id};break;
   case"ff-kbhelp":msg("How FixFlow works","1. Pick an incident from the list.\n2. Read the form and the KB article.\n3. Talk to the caller (phone or in person) and make the fix in Active Directory.\n4. Close it at the top:\n   Resolve = you fixed it.\n   On Hold = waiting on someone else (like HR).\n   Reassign = it belongs to another team (Tier 2 or Security).","info");return;
   default:if(/^(m-|pc-newuser|pc-find|pc-refresh|pc-adv)/.test(a)){menuAction(a);return}
  }
  uiDirty=true;renderUI();
});
function openCtx(e,k){
  const pcEl=document.querySelector("#pc .dsk");if(!pcEl)return;const r=pcEl.getBoundingClientRect();
  if(!k||k[0]!=="o"||document.querySelector('.list tr[data-k="'+k+'"]'))S.pc.selKey=k;S.pc.menuKey=k;S.pc.mbar=null;
  let x=e.clientX-r.left,y=e.clientY-r.top;x=Math.min(x,r.width-200);y=Math.min(y,r.height-260);
  S.pc.menu={x:Math.max(0,x),y:Math.max(0,y),k};uiDirty=true;renderUI();
}
document.addEventListener("contextmenu",e=>{
  if(!S.pc||!S.pc.open)return;
  const frow=e.target.closest('[data-a="d-findsel"]');if(frow){e.preventDefault();const dl=topDlg();if(dl&&dl.type==="find")dl.draft.sel=frow.dataset.k;openCtx(e,frow.dataset.k);return}
  const row=e.target.closest('[data-a="pc-row"]');const lst=e.target.closest(".list");const tn=e.target.closest('.tn[data-a="pc-tree"]');
  if(row){e.preventDefault();openCtx(e,row.dataset.k)}
  else if(tn&&tn.dataset.p&&tn.dataset.p!=="__saved"){e.preventDefault();S.pc.path=tn.dataset.p;openCtx(e,"o:"+tn.dataset.p)}
  else if(lst){e.preventDefault();openCtx(e,null)}
  else if(e.target.closest(".appwin,.dlgback"))e.preventDefault();
});
let lpT=null;
document.addEventListener("touchstart",e=>{
  if(!S.pc||!S.pc.open)return;const row=e.target.closest('[data-a="pc-row"],[data-a="d-findsel"]');if(!row)return;
  const t=e.touches[0];const fake={clientX:t.clientX,clientY:t.clientY};
  lpT=setTimeout(()=>{lpT=null;openCtx(fake,row.dataset.k);S.pc.suppressClick=true},550);
},{passive:true});
["touchend","touchmove","touchcancel"].forEach(ev=>document.addEventListener(ev,()=>{if(lpT){clearTimeout(lpT);lpT=null}},{passive:true}));
document.addEventListener("click",e=>{if(S.pc&&S.pc.suppressClick){S.pc.suppressClick=false;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener("dblclick",e=>{const row=e.target.closest('[data-a="pc-row"]');if(row&&S.pc.open){const k=row.dataset.k;if(k[0]==="o"){S.pc.path=k.slice(2);S.pc.selKey=null}else openProps(k);uiDirty=true;renderUI()}});
function onBind(e){
  const el=e.target;
  if(el.dataset&&el.dataset.ff&&S.pc&&S.pc.ffClose){if(el.type==="radio"&&!el.checked)return;S.pc.ffClose[el.dataset.ff]=el.value;return}if(!el.dataset||!el.dataset.bind||el.dataset.bind==="x"||!S.pc||!S.pc.open)return;
  const dl=topDlg();if(!dl||!dl.draft)return;
  const key=el.dataset.bind;let v=el.type==="checkbox"?el.checked:el.value;
  if(el.type==="radio"){if(!el.checked)return;v=el.value}
  dl.draft[key]=v;
  if(dl.type==="select"&&key==="text"){dl.draft.resolved=null;dl.draft.multi=null}
  if(dl.type==="newuser"){if(key==="first"||key==="last"||key==="init"){const r=dl.draft;r.full=[r.first,r.init?r.init+".":"",r.last].filter(Boolean).join(" ");const f=document.getElementById("nu-full");if(f)f.value=r.full}
    if(key==="logon"){const p=document.getElementById("nu-pre");if(p)p.value=v}}
  if(el.type==="radio"&&key==="expMode"&&v==="end"&&!dl.draft.expDate){dl.draft.expDate=TODAY;const di=document.querySelector('[data-bind="expDate"]');if(di)di.value=TODAY}
}
document.addEventListener("input",onBind);document.addEventListener("change",onBind);
document.addEventListener("keydown",e=>{
  if(document.activeElement&&document.activeElement.id==="np-text"){if(e.key==="Escape")document.activeElement.blur();return}
  if(S.screen==="title"&&(e.key==="Enter")){newGame("beginner");return}
  if(S.screen!=="game")return;
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"");
  if(S.modal&&S.modal.type!=="note"&&e.key==="Escape"){S.modal=null;uiDirty=true;renderUI();return}
  if(S.pc.open){
    if(e.key==="Escape"){if(S.pc.menu||S.pc.mbar){S.pc.menu=null;S.pc.mbar=null}else if(S.pc.dlgs.length)closeDlg();else if(S.pc.app)S.pc.app=null;else{closePC();return}uiDirty=true;renderUI();return}
    if(e.key==="Enter"&&!typing){const dl=topDlg();if(dl){const def=document.querySelector("#pc .dlgback:last-of-type .wbtn.def");if(def&&!def.disabled){def.click();e.preventDefault()}}}
    if(e.key==="Enter"&&typing){const dl=topDlg();if(dl&&dl.type==="find"&&document.activeElement.id==="find-name"){doFind(dl);uiDirty=true;renderUI();e.preventDefault()}}
    return;
  }
  if(S.modal){if(e.key==="Escape"||(e.key==="Enter"&&S.modal.type==="result")){if(S.modal.type!=="note"){S.modal=null;uiDirty=true;renderUI()}}return}
  if(S.dlg){
    if(S.dlg.choices){if(e.key==="ArrowDown"||e.key==="s"){S.dlgSel=(S.dlgSel+1)%S.dlg.choices.length;uiDirty=true;e.preventDefault()}
      else if(e.key==="ArrowUp"||e.key==="w"){S.dlgSel=(S.dlgSel-1+S.dlg.choices.length)%S.dlg.choices.length;uiDirty=true;e.preventDefault()}
      else if(e.key===" "||e.key==="Enter"){pick(S.dlgSel);e.preventDefault()}
      else if(e.key==="Escape"){pick(S.dlg.choices.length-1)}}
    else if(e.key===" "||e.key==="Enter"||e.key==="Escape"){advance();e.preventDefault()}
    return;
  }
  if(e.key in KEYDIR){pressDir(KEYDIR[e.key]);e.preventDefault();return}
  if(e.key===" "||e.key==="Enter"||e.key==="e"||e.key==="E"){interact();e.preventDefault()}
  if(e.key==="p"||e.key==="P"){S.paused=!S.paused;uiDirty=true}
});
document.addEventListener("keyup",e=>{if(e.key in KEYDIR)releaseDir(KEYDIR[e.key])});
window.addEventListener("blur",()=>{held.length=0});
document.querySelectorAll(".dpad button").forEach(btn=>{const d=Number(btn.dataset.dir);
  btn.addEventListener("pointerdown",e=>{e.preventDefault();btn.setPointerCapture&&btn.setPointerCapture(e.pointerId);
    if(S.dlg&&S.dlg.choices){if(d===0)S.dlgSel=(S.dlgSel+1)%S.dlg.choices.length;if(d===3)S.dlgSel=(S.dlgSel-1+S.dlg.choices.length)%S.dlg.choices.length;uiDirty=true;return}
    pressDir(d)});
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>btn.addEventListener(ev,()=>releaseDir(d)));});
document.querySelector('[data-btn="a"]').addEventListener("pointerdown",e=>{e.preventDefault();if(S.dlg){if(S.dlg.choices)pick(S.dlgSel);else advance()}else if(S.modal){}else interact()});
document.querySelector('[data-btn="b"]').addEventListener("pointerdown",e=>{e.preventDefault();if(S.dlg){if(S.dlg.choices)pick(S.dlg.choices.length-1);else advance()}});
window.addEventListener("resize",()=>{if(S.screen==="game")resize()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(TILES)buildMapCanvas()});
npInit();renderUI();requestAnimationFrame(loop);
</script>
